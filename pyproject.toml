[project]
name = "kaggriculture"
version = "0.1.0"
description = "Kaggle Lux AI / Kaggriculture competition agent, arena and workflow"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "kaggle>=1.6.14",
    "kaggle-environments>=1.32.6",
    "numpy>=2.0.0",
    "torch>=2.13.0",
]

[dependency-groups]
dev = [
    "mypy>=1.14.0",
    "pre-commit>=4.0.0",
    "pytest>=8.3.0",
    "ruff>=0.9.0",
]

[tool.uv]
# Flat script layout, not an installable library.
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501", # line length handled by ruff format
    "B008", # do not perform function calls in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["main", "local_arena", "submit", "leaderboard_crawler"]

[tool.mypy]
python_version = "3.12"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = false
check_untyped_defs = false

[[tool.mypy.overrides]]
module = [
    "kaggle.*",
    "kaggle_environments.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests", "."]
python_files = ["test_*.py", "*_test.py"]

[tool.pyrefly]
python-version = "3.12.0"
preset = "legacy"
ignore-missing-imports = [
    "kaggle.*",
    "kaggle_environments.*",
    "*",
]
