[project]
name = "kaggriculture"
version = "0.1.0"
description = "Kaggle Lux AI / Kaggriculture competition agent, arena and workflow"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "kaggle>=1.6.14",
    "kaggle-environments>=1.32.7",
    "kagglehub>=1.0.2",
    "numpy>=2.0.0",
    "typesafe-sdk>=0.7.0",
]

[dependency-groups]
dev = [
    "mypy>=1.14.0",
    "pre-commit>=4.0.0",
    "pytest>=8.3.0",
    "ruff>=0.9.0",
]

[tool.uv]
# Flat script layout, not an installable library.
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
# Vendored third-party code: Rayk Kretzschmar's reference ladder (MIT, see
# opponents/ladder/LICENSE and NOTICE). Kept byte-identical to the published
# dataset so a ranking result is reproducible against it -- do not reformat.
extend-exclude = [
    "opponents/ladder",
    # Vendored third-party chassis (Apache-2.0, attributed in file headers):
    # the v0.4.0 promoted chassis, its frozen snapshot, and the three public
    # kernel sources kept for reference/provenance. Byte-identical to the
    # published/submitted artifacts -- do not reformat.
    "main.py",
    "opponents/v0_4_0.py",
    "opponents/v0_4_1.py",
    "opponents/v0_4_2.py",
    "opponents/v0_4_3.py",
    "opponents/v0_5_0.py",
    "docs/kaggriculture_metacounter_r1_scored_agent.py",
    "docs/farming-score-v4-a-better-shop.ipynb",
    "docs/kaggriculture-v41-review-candidate.ipynb",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501", # line length handled by ruff format
    "B008", # do not perform function calls in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["main", "local_arena", "submit", "search"]

[tool.mypy]
python_version = "3.12"
# scripts/ is a flat directory whose members import each other by top-level name after a
# sys.path insert. Without this, mypy maps scripts/v043_common.py to BOTH "v043_common"
# and "scripts.v043_common" and refuses to check the directory at all.
explicit_package_bases = true
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = false
check_untyped_defs = false
# Vendored third-party chassis (Apache-2.0, attributed in the file headers):
# byte-identical to the submitted artifacts. The deliberate
# ``agent = globals().pop('agent')`` layer-chain idiom trips no-redef, and the
# public sources are untyped -- do not "fix" a proven, submitted artifact.
# ``ignore_errors`` (not ``exclude``) because qa.yml lists main.py explicitly.
# logs/ is excluded because its generated agents collide on module names
# (the same route hash is mined into two trees).
exclude = [
    '^main\.py$',
    '^opponents/v0_4_0\.py$',
    '^opponents/v0_4_1\.py$',
    '^opponents/v0_4_2\.py$',
    '^opponents/v0_4_3\.py$',
    '^docs/kaggressur_metacounter_r1_scored_agent\.py$',
    '^logs/',
    # reference/ladder/ and opponents/ladder/ carry the same vendored ladder files
    # (MIT, Rayk Kretzschmar) with colliding module names.
    '^reference/',
    # scratch/public_kernels/ mirrors the docs/ vendored kernels (working copies).
    '^scratch/',
]

[[tool.mypy.overrides]]
module = ["main"]
ignore_errors = true

# Pre-existing scripts, ignored so that scripts/ can be type-checked at all rather than
# left out entirely (it was, until 2026-09-21, which is how the two breakages below went
# unnoticed). These are NOT clean and should not be assumed working:
#
#   compare_routes, analyse_movement -- reference `main._ROUTE`, which has not existed
#     since the v0.4.0 chassis pivot; main.py defines `_ROUTES`. Both raise
#     AttributeError on import. They analyse the retired single-route line, so they are
#     left broken-and-flagged rather than guessed at.
#   v043_common, v043_panel, v043_fills -- produced the measurements v0.4.3 and v0.5.1
#     ship. Byte-for-byte reproducibility of those numbers outranks a type annotation;
#     do not refactor them to satisfy mypy.
#
# Anything ADDED to scripts/ from here on must type-check. Do not extend this list to
# make a new script pass.
[[tool.mypy.overrides]]
# Both spellings: mypy names these "scripts.x" when the directory is passed on the
# command line and "x" when another script imports them by top-level name.
module = [
    "compare_routes",
    "analyse_movement",
    "v043_common",
    "v043_panel",
    "v043_fills",
    "scripts.compare_routes",
    "scripts.analyse_movement",
    "scripts.v043_common",
    "scripts.v043_panel",
    "scripts.v043_fills",
]
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "kaggle.*",
    "kaggle_environments.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests", "."]
python_files = ["test_*.py", "*_test.py"]
# Flat layout, nothing installed: without this a test under tests/ cannot import
# the pipeline modules that sit at the repo root.
pythonpath = ["."]

[tool.pyrefly]
python-version = "3.12.0"
preset = "legacy"
ignore-missing-imports = [
    "kaggle.*",
    "kaggle_environments.*",
    "*",
]
