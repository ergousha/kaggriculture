name: Release & Publish to Kaggle

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release-and-publish:
    name: Release & Publish Agent
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup uv and Python
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install dependencies
        run: |
          uv sync --all-extras --dev

      - name: Extract Agent Version
        id: get_version
        run: |
          VERSION=$(python -c "import re; m = re.search(r'^AGENT_VERSION\s*=\s*[\"\\\']([^\"\\\']+)[\"\\\']', open('main.py').read(), re.M); print(m.group(1) if m else '0.0.0')")
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=v${VERSION}" >> $GITHUB_OUTPUT
          echo "Agent version extracted: v${VERSION}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: Release v${{ steps.get_version.outputs.version }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Submit Agent to Kaggle
        run: |
          uv run python submit.py -m "Automated release v${{ steps.get_version.outputs.version }}"
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_TOKEN }}
