name: Release & Publish to Kaggle

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release-and-publish:
    name: Release & Publish Agent
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup uv and Python
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install dependencies
        run: |
          uv sync --dev

      - name: Extract Agent Version
        id: get_version
        run: |
          VERSION=$(grep -E "^AGENT_VERSION\s*=" main.py | sed -E "s/.*['\"]([^'\"]+)['\"].*/\1/")
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=v${VERSION}" >> $GITHUB_OUTPUT
          echo "Agent version extracted: v${VERSION}"
          
          if git ls-remote --tags origin "refs/tags/v${VERSION}" | grep -q "refs/tags/v${VERSION}"; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Tag v${VERSION} already exists. Skipping release and publish."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Tag v${VERSION} does not exist. Proceeding with release and publish."
          fi

      - name: Create GitHub Release
        if: steps.get_version.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: Release v${{ steps.get_version.outputs.version }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Submit Agent to Kaggle
        if: steps.get_version.outputs.exists == 'false'
        run: |
          uv run python submit.py -m "Automated release v${{ steps.get_version.outputs.version }}"
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_TOKEN }}
