name: Quality Assurance CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  qa:
    name: Quality Assurance
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup uv and Python
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.13"

      - name: Install dependencies
        run: |
          uv sync --dev

      - name: Run Ruff Linter
        run: |
          uv run ruff check .

      - name: Run Ruff Formatter Check
        run: |
          uv run ruff format --check .

      - name: Run Mypy Type Check
        run: |
          uv run mypy submit.py main.py local_arena.py \
            mine_replays.py simulate_candidates.py rank_cvar.py encode_submission.py mining/

      - name: Run Agent Pre-flight & Smoke Test
        run: |
          uv run python submit.py --dry-run
